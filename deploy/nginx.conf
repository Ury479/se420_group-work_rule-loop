server {
    listen 80;
    server_name 103.108.67.49;
    location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://103.108.67.49$request_uri; }
}
server {
    listen 443 ssl;
    server_name 103.108.67.49;
    ssl_certificate /etc/letsencrypt/live/103.108.67.49/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/103.108.67.49/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
