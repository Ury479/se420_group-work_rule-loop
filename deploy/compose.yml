name: ruleloop-app
services:
  db:
    image: ${POSTGRES_IMAGE:?set pinned POSTGRES_IMAGE}
    restart: unless-stopped
    env_file: /opt/ruleloop/shared/database.env
    volumes:
      - /var/lib/ruleloop/postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  migrate:
    image: ruleloop-migrate:${RELEASE_ID:?set RELEASE_ID}
    build:
      context: ..
      target: migrate
      args:
        NODE_IMAGE: ${NODE_IMAGE:?set pinned NODE_IMAGE}
    env_file: /opt/ruleloop/shared/migration.env
    depends_on:
      db: {condition: service_healthy}
    profiles: [tools]
    logging: *logging
  web:
    image: ruleloop-app:${RELEASE_ID:?set RELEASE_ID}
    build:
      context: ..
      target: runner
      args:
        NODE_IMAGE: ${NODE_IMAGE:?set pinned NODE_IMAGE}
    restart: unless-stopped
    init: true
    env_file: /opt/ruleloop/shared/runtime.env
    ports: ["127.0.0.1:3100:3000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "Promise.all([fetch('http://127.0.0.1:3000/sign-in').then(r=>{if(!r.ok)throw Error('HTTP')}),(async()=>{const {Pool}=require('pg');const p=new Pool({connectionString:process.env.DATABASE_URL,connectionTimeoutMillis:3000});try{await p.query('select 1')}finally{await p.end()}})()]).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging: *logging
