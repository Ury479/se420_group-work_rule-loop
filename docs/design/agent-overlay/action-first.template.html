<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>开工准备 · RuleLoop</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="action-first.css?v=PREVIEW_ASSET_REV">
</head>
<body>
  <header class="prep-preview">
    <div class="prep-location"><strong>RuleLoop</strong><span>布防</span></div>
    <div class="prep-tools">
      <details class="prep-examples">
        <summary>演示情境</summary>
        <div class="prep-menu">
          <button type="button" data-example="scope">准备加入 Personal Agent</button>
          <button type="button" data-example="build">目标明确，修复编译错误</button>
        </div>
      </details>
      <button id="form-mode" class="prep-plain" type="button">原表单</button>
      <button id="prep-mode" class="prep-plain" type="button" hidden>返回准备</button>
    </div>
  </header>
  <!-- APP_SHELL -->
  <template id="prep-template">
    <section id="prep" class="prep" aria-labelledby="prep-action">
      <div class="prep-intro">
        <div class="prep-symbol" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M14 3c1.3 7.8 3.2 9.7 11 11-7.8 1.3-9.7 3.2-11 11-1.3-7.8-3.2-9.7-11-11 7.8-1.3 9.7-3.2 11-11Z" fill="currentColor"/><path d="M25 19c.5 3.5 1.5 4.5 5 5-3.5.5-4.5 1.5-5 5-.5-3.5-1.5-4.5-5-5 3.5-.5 4.5-1.5 5-5Z" fill="currentColor" opacity=".55"/></svg>
        </div>
        <p id="prep-task" class="prep-task"></p>
        <h1 id="prep-action"></h1>
      </div>
      <article class="prep-card" aria-label="Agent 准备的草稿">
        <div class="prep-draft">
          <label id="prep-label" for="prep-text"></label>
          <textarea id="prep-text" maxlength="1000" rows="4"></textarea>
        </div>
        <div class="prep-actions">
          <p id="prep-status" class="prep-status" role="status"></p>
          <button id="prep-save" class="prep-primary" type="button">存入布防草稿</button>
        </div>
      </article>
      <details id="prep-reason" class="prep-reason">
        <summary id="prep-reason-title"></summary>
        <div class="prep-evidence">
          <p id="prep-source-note"></p>
          <blockquote id="prep-origin"></blockquote>
          <p id="prep-origin-title" class="prep-caption"></p>
        </div>
      </details>
      <p class="prep-caption prep-preview-note">交互演示 · 模拟建议 · 草稿存于本机</p>
    </section>
  </template>
  <script type="application/json" id="prep-origin-data"><!-- CASE_SOURCE --></script>
  <script src="action-first.js?v=PREVIEW_ASSET_REV"></script>
</body>
</html>
